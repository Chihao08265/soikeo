<!-- language: HTML/CSS/JS, file: index.html, target: Mobile-first -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChiHao Pro Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        
        /* LOGIN SCREEN */
        #login-screen { position: fixed; inset: 0; background: #0b0f19; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-box h2 { color: #38bdf8; margin-bottom: 20px; font-size: 22px; }
        .login-box input { width: 100%; padding: 15px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; margin-bottom: 15px; font-size: 16px; outline: none; text-align: center; }
        .login-box input:focus { border-color: #38bdf8; }
        .login-box button { width: 100%; padding: 15px; background: #38bdf8; color: #0b0f19; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .login-box button:hover { background: #0ea5e9; }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 10px; display: none; }

        /* MAIN APP */
        #app-container { width: 100%; max-width: 600px; display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .header h1 { font-size: 20px; color: #38bdf8; letter-spacing: 1px; }
        .logout-btn { background: none; border: 1px solid #ef4444; color: #ef4444; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 10px 15px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; transition: 0.2s; }
        .tab.active { background: #38bdf8; color: #0b0f19; border-color: #38bdf8; }

        .match-list { display: flex; flex-direction: column; gap: 12px; }
        .match-card { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; }
        .match-header { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; }
        .status-live { color: #ef4444; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .dot { width: 6px; height: 6px; background: #ef4444; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .teams { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .team { font-size: 15px; font-weight: 600; flex: 1; }
        .team.away { text-align: right; }
        .score { font-size: 18px; font-weight: 800; color: #fbbf24; padding: 0 15px; }
        
        .btn-analyze { width: 100%; padding: 12px; background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid #38bdf8; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-analyze:hover { background: #38bdf8; color: #0b0f19; }

        /* MODAL PHÂN TÍCH */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(4px); justify-content: center; align-items: flex-end; z-index: 100; }
        .modal.show { display: flex; }
        .modal-content { background: #1e293b; width: 100%; max-width: 600px; border-radius: 20px 20px 0 0; padding: 20px; border-top: 2px solid #38bdf8; animation: slideUp 0.3s ease; max-height: 88vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .close-btn { position: absolute; top: 15px; right: 15px; background: #334155; border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        
        .modal-title { color: #38bdf8; font-size: 18px; margin-bottom: 20px; text-align: center; font-weight: bold; padding-right: 20px; }
        
        .analysis-section { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid #38bdf8; }
        .analysis-section h3 { font-size: 13px; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .data-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #e2e8f0; }
        .highlight-val { color: #4ade80; font-weight: bold; font-size: 15px; }
        
        .expert-note { background: rgba(251, 191, 36, 0.1); border: 1px dashed #fbbf24; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .expert-note h3 { color: #fbbf24; font-size: 14px; margin-bottom: 8px; }
        .expert-note p { font-size: 14px; line-height: 1.6; color: #cbd5e1; margin-bottom: 8px;}
        .verdict { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 14px; margin-top: 10px;}
        .verdict.home { background: rgba(74, 222, 128, 0.2); color: #4ade80; border: 1px solid #4ade80;}
        .verdict.away { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444;}
        .verdict.ou { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8;}
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
    <div class="login-box">
        <h2>ChiHao Pro Analyzer</h2>
        <input type="password" id="keyInput" placeholder="Nhập Pass Key...">
        <button onclick="checkLogin()">Truy Cập Hệ Thống</button>
        <div class="error-msg" id="err">Sai Pass Key rồi!</div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app-container">
    <div class="header">
        <h1>ChiHao Pro</h1>
        <button class="logout-btn" onclick="logout()">Đăng Xuất</button>
    </div>

    <div class="nav-tabs">
        <div class="tab active" onclick="loadMatches('EPL', this)">NHA</div>
        <div class="tab" onclick="loadMatches('ESP', this)">La Liga</div>
        <div class="tab" onclick="loadMatches('UCL', this)">C1</div>
    </div>

    <div class="loading" id="loading">Đang tải dữ liệu trận đấu...</div>
    <div class="match-list" id="matchList"></div>
</div>

<!-- MODAL SOI KÈO -->
<div class="modal" id="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <div class="modal-title" id="mTitle">Tên trận đấu</div>
        <div id="mContent"></div>
    </div>
</div>

<script>
    // CẤU HÌNH HỆ THỐNG
    const API_KEY = 'ZakQu8YllYP8WG7k'; 
    const BASE_URL = 'http://api.isportsapi.com/sport/football';
    const PASS_KEY = 'ChiHaoSoiKeo'; 
    const leagueIds = { 'EPL': 36, 'ESP': 31, 'UCL': 45 };

    // ==========================================
    // CHỨC NĂNG LOGIN
    // ==========================================
    function checkLogin() {
        const input = document.getElementById('keyInput').value;
        if(input === PASS_KEY) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            loadMatches('EPL', document.querySelector('.tab.active'));
        } else {
            document.getElementById('err').style.display = 'block';
            document.getElementById('keyInput').style.borderColor = '#ef4444';
        }
    }

    function logout() {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('keyInput').value = '';
        document.getElementById('err').style.display = 'none';
        document.getElementById('keyInput').style.borderColor = '#334155';
        document.getElementById('matchList').innerHTML = '';
    }

    // ==========================================
    // LẤY DANH SÁCH TRẬN
    // ==========================================
    async function loadMatches(leagueCode, el) {
        if(el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        const list = document.getElementById('matchList');
        const loading = document.getElementById('loading');
        
        list.innerHTML = '';
        loading.style.display = 'block';

        try {
            const leagueId = leagueIds[leagueCode];
            const url = `${BASE_URL}/match/list?api_key=${API_KEY}&time=all&leagueId=${leagueId}`;
            
            const response = await fetch(url);
            if(!response.ok) throw new Error('Lỗi API');
            const data = await response.json();
            
            loading.style.display = 'none';
            const matches = data.data || data.results || [];

            if(matches.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:20px;">Không có trận nào.</p>';
                return;
            }

            matches.slice(0, 20).forEach(m => {
                const isLive = m.status === 2; 
                const timeStr = m.matchTime ? new Date(m.matchTime).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) : 'N/A';

                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-header">
                        <span>${m.leagueName || 'Giải đấu'}</span>
                        <span>${isLive ? '<span class="status-live"><span class="dot"></span> LIVE</span>' : timeStr}</span>
                    </div>
                    <div class="teams">
                        <div class="team">${m.homeName}</div>
                        <div class="score">${m.homeScore || 0} - ${m.awayScore || 0}</div>
                        <div class="team away">${m.awayName}</div>
                    </div>
                    <button class="btn-analyze" onclick="analyzeMatch('${m.matchId}', '${m.homeName}', '${m.awayName}')">Phân Tích Siêu Ác</button>
                `;
                list.appendChild(card);
            });

        } catch (error) {
            loading.style.display = 'none';
            list.innerHTML = `<p style="text-align:center; color:#ef4444; margin-top:20px;">Lỗi: ${error.message}</p>`;
        }
    }

    // ==========================================
    // PHÂN TÍCH SIÊU ÁC (HLB LOGIC)
    // ==========================================
    async function analyzeMatch(matchId, homeName, awayName) {
        document.getElementById('mTitle').innerText = `${homeName} vs ${awayName}`;
        document.getElementById('mContent').innerHTML = '<div class="loading" style="display:block">Đang giải mã odds nhà cái...</div>';
        document.getElementById('modal').classList.add('show');

        try {
            const url = `${BASE_URL}/odds/main?api_key=${API_KEY}&matchId=${matchId}`;
            const response = await fetch(url);
            const data = await response.json();
            
            const oddsData = data.data || data.results || {};
            
            let html = '';
            
            // Khởi tạo biến
            let ahHome = 0, ahAway = 0, handicap = 0;
            let euHome = 0, euDraw = 0, euAway = 0;
            let ouOver = 0, ouUnder = 0, total = 0;

            // Bóc data
            if(oddsData.ah && oddsData.ah.length > 0) {
                const ah = oddsData.ah[0];
                ahHome = parseFloat(ah.homeOdds) || 0;
                ahAway = parseFloat(ah.awayOdds) || 0;
                handicap = parseFloat(ah.handicap) || 0;
                html += `
                <div class="analysis-section">
                    <h3>Kèo Châu Á</h3>
                    <div class="data-row"><span>${homeName}:</span> <span class="highlight-val">${ahHome}</span></div>
                    <div class="data-row"><span>Chấp:</span> <span>${handicap > 0 ? '+' + handicap : handicap}</span></div>
                    <div class="data-row"><span>${awayName}:</span> <span class="highlight-val">${ahAway}</span></div>
                </div>`;
            }

            if(oddsData.europe || oddsData.oneXtwo) {
                const eu = oddsData.europe || oddsData.oneXtwo;
                euHome = parseFloat(eu.home) || 0;
                euDraw = parseFloat(eu.draw) || 0;
                euAway = parseFloat(eu.away) || 0;
                html += `
                <div class="analysis-section">
                    <h3>Kèo Châu Âu</h3>
                    <div class="data-row"><span>Thắng:</span> <span class="highlight-val">${euHome}</span></div>
                    <div class="data-row"><span>Hòa:</span> <span class="highlight-val">${euDraw}</span></div>
                    <div class="data-row"><span>Thua:</span> <span class="highlight-val">${euAway}</span></div>
                </div>`;
            }

            if(oddsData.ou && oddsData.ou.length > 0) {
                const ou = oddsData.ou[0];
                ouOver = parseFloat(ou.overOdds) || 0;
                ouUnder = parseFloat(ou.underOdds) || 0;
                total = parseFloat(ou.total) || 2.5;
                html += `
                <div class="analysis-section">
                    <h3>Kèo Tài Xỉu</h3>
                    <div class="data-row"><span>Tài:</span> <span class="highlight-val">${ouOver}</span></div>
                    <div class="data-row"><span>Mốc:</span> <span>${total}</span></div>
                    <div class="data-row"><span>Xỉu:</span> <span class="highlight-val">${ouUnder}</span></div>
                </div>`;
            }

            // ==========================================
            // BỘ LỌC LOGIC CHUYÊN GIA (HLB)
            // ==========================================
            let analysisText = "";
            let finalPick = "";
            let pickClass = "";

            if (ahHome > 0 && ahAway > 0 && ouOver > 0) {
                const isHomeStrong = ahHome < ahAway;
                const isAwayStrong = ahAway < ahHome;
                const isOuHigh = ouOver < ouUnder; // Tài ăn thấp -> trận nhiều bàn
                
                // Kịch bản 1: Kèo chấp sâu nhưng Tài Xỉu thấp (Kèo dụ)
                if (Math.abs(handicap) >= 1.0 && total <= 2.5) {
                    analysisText = `Bẫy kèo! Kèo chấp khá sâu (${handicap}) nhưng mốc Tài Xỉu lại chỉ ${total}. Điều này cho thấy nhà cái không tin trận này sẽ bung nổ bàn thắng, hoặc đội cửa trên sẽ thắng nhưng rất chật vật. Khuyên bắt cửa Xỉu hoặc rung đội cửa dưới.`;
                    finalPick = `Xỉu ${total}`;
                    pickClass = "ou";
                } 
                // Kịch bản 2: Đội nhà bị đánh giá thấp nhưng odds ngang bằng
                else if (handicap > 0 && ahAway > 2.0) {
                    analysisText = `${awayName} được đánh giá cao hơn (chấp ${handicap}), nhưng odds ăn của họ lên tới ${ahAway}. Đây là bẫy! Nhà cái đang dụ đánh cửa khách. ${homeName} có lợi thế sân nhà và hoàn toàn có thể cầm hòa.`;
                    finalPick = `${homeName} +${handicap}`;
                    pickClass = "home";
                }
                // Kịch bản 3: Đội khách vượt trội
                else if (handicap < 0 && ahAway < 1.85) {
                    analysisText = `Odds ăn của ${awayName} rất thấp (${ahAway}) bất chấp việc phải làm khách. Dữ liệu nhà cái cho thấy họ nắm chắc phần thắng trong tay. Cửa sáng nhất là bắt cửa khách.`;
                    finalPick = `${awayName} thắng kèo`;
                    pickClass = "away";
                }
                // Kịch bản 4: Đồng banh nổ Tài
                else if (Math.abs(handicap) < 0.25 && isOuHigh) {
                    analysisText = `Kèo đồng banh (${handicap}), hai đội ngang tài ngang sức. Tuy nhiên mốc Tài Xỉu là ${total} và cửa Tài ăn thấp (${ouOver}). Dự báo một trận cống hiến, đôi công hấp dẫn. Cửa Tài là sáng nhất.`;
                    finalPick = `Tài ${total}`;
                    pickClass = "ou";
                }
                // Kịch bản 5: Kèo trên quá rõ ràng
                else {
                    if (isHomeStrong) {
                        analysisText = `Mọi thông số đều ủng hộ ${homeName}. Odds ăn thấp (${ahHome}), kèo chấp ở mức an toàn (${handicap}). Nhà cái không có dấu hiệu giăng bẫy. Cứ bắt cửa trên.`;
                        finalPick = `${homeName} thắng kèo`;
                        pickClass = "home";
                    } else {
                        analysisText = `${awayName} nhỉnh hơn về mọi mặt. Odds ăn ${ahAway} là hợp lý để ăn tiền. Trận này khó có biến cố.`;
                        finalPick = `${awayName} thắng kèo`;
                        pickClass = "away";
                    }
                }
            } else {
                analysisText = "Dữ liệu kèo chưa đủ dày để đưa ra nhận định siêu ác. Cần theo dõi thêm biến động odds.";
            }

            html += `
                <div class="expert-note">
                    <h3>🧠 Nhận Định Từ Chuyên Gia</h3>
                    <p>${analysisText}</p>
                    <div class="verdict ${pickClass}">CHỐT: ${finalPick}</div>
                </div>
            `;

            document.getElementById('mContent').innerHTML = html;

        } catch (error) {
            document.getElementById('mContent').innerHTML = `<p style="text-align:center; color:#ef4444;">Lỗi: ${error.message}</p>`;
        }
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('show');
    }
</script>

</body>
</html>
